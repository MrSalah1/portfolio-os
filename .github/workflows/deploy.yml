name: Deploy to GitHub Pages

# The site is a static build with no server component, so deploying is just
# building and publishing dist/. This runs on every push to the default branch
# and can also be triggered by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build only needs to read the repository. Publishing to
# Pages additionally needs pages:write for the deployment and id-token:write
# to mint the token the Pages API requires.
permissions:
  contents: read
  pages: write
  id-token: write

# Two pushes in quick succession should not race each other to the same URL.
# The newer run wins and cancels the one still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Vite 8 requires Node 20.19+ or 22.12+; 24 is what this is built on.
          node-version: 24
          cache: npm

      # npm ci rather than npm install: it installs exactly what the committed
      # lockfile pins, so the deployed bundle cannot drift from the tested one.
      - run: npm ci

      # Already type-checks via tsc -b before vite build, so a type error fails
      # the deploy rather than shipping.
      - run: npm run build

      # Resolves the Pages site URL. enablement turns Pages on for the
      # repository when it is not already enabled, so a first deploy does not
      # need a visit to the settings page. If this step is denied permission,
      # set Settings > Pages > Source to "GitHub Actions" once and re-run.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
